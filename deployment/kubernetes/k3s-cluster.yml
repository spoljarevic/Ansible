---
- name: Install K3s server
  hosts: k3s-master
  become: true
  tasks:
    - name: Download the K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Install K3s server
      ansible.builtin.command: /tmp/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s server to be ready
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60

    - name: Read K3s node token
      ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token
      changed_when: false

    - name: Set fact with K3s token
      ansible.builtin.set_fact:
        k3s_token_value: "{{ k3s_token.stdout }}"

- name: Install K3s agents
  hosts: k3s-workers
  become: true
  vars:
    master_ip: "{{ hostvars['w2l-srv-aap'].ansible_host }}"
    node_token: "{{ hostvars['w2l-srv-aap'].k3s_token_value }}"
  tasks:
    - name: Download the K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Install K3s agent
      ansible.builtin.command: /tmp/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        K3S_URL: "https://{{ master_ip }}:6443"
        K3S_TOKEN: "{{ node_token }}"

- name: Verify cluster nodes
  hosts: k3s-master
  become: true
  tasks:
    - name: List all K3s nodes
      ansible.builtin.command: k3s kubectl get nodes
      register: nodes
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
