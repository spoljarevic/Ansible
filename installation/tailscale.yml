---
- name: Install and bring up Tailscale
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Download the Tailscale install script
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: "0755"

    - name: Install Tailscale
      ansible.builtin.command: /tmp/tailscale-install.sh
      args:
        creates: /usr/bin/tailscale

    - name: Bring Tailscale online
      ansible.builtin.command: tailscale up --auth-key={{ TAILTOKEN }}
      register: tailscale_output
      changed_when: true
      become: true

    - name: Show Tailscale login URL
      ansible.builtin.debug:
        msg: "{{ tailscale_output.stdout }}"
