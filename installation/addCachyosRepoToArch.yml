---
# playbook: cachyos-setup.yml
# Purpose:
#   - Import the CachyOS signing key
#   - Install the CachyOS keyring and mirrorlist packages
#   - Add the required CachyOS repository definitions to pacman.conf
#   - Refresh pacman metadata
#
# Usage:
#   ansible-playbook -i inventory.yml cachyos-setup.yml

- name: Configure CachyOS repositories on all hosts
  hosts: all
  become: true
  vars:
    # GPG key used to sign CachyOS packages
    cachyos_gpg_key: "F3B607488DB35A47"
    keyserver: "keyserver.ubuntu.com"

    # Packages fetched directly from the CachyOS mirror (latest version is looked up at runtime).
    # These provide the keyring and mirror lists needed before enabling the repo.
    cachyos_mirror: "https://mirror.cachyos.org/repo/x86_64/cachyos"
    cachyos_pkg_names:
      - cachyos-keyring
      - cachyos-mirrorlist
      - cachyos-v3-mirrorlist
      - cachyos-v4-mirrorlist

    # Repository definitions to be appended to /etc/pacman.conf
    pacman_repo_block: |
      [cachyos-v4]
      Include = /etc/pacman.d/cachyos-v4-mirrorlist

      [cachyos-core-v4]
      Include = /etc/pacman.d/cachyos-v4-mirrorlist

      [cachyos-extra-v4]
      Include = /etc/pacman.d/cachyos-v4-mirrorlist

      [cachyos]
      Include = /etc/pacman.d/cachyos-mirrorlist

  tasks:
    # Retrieve the CachyOS signing key from the configured keyserver
    - name: Receive CachyOS signing key
      ansible.builtin.command:
        cmd: "pacman-key --recv-keys {{ cachyos_gpg_key }} --keyserver {{ keyserver }}"
      register: recv_key
      changed_when: "'imported' in recv_key.stdout.lower()"

    # Mark the imported key as locally trusted
    - name: Locally sign the received key
      ansible.builtin.command:
        cmd: "pacman-key --lsign-key {{ cachyos_gpg_key }}"
      register: lsign_key
      changed_when: "'locally signed' in lsign_key.stdout.lower()"

    - name: Fetch the CachyOS repository index
      ansible.builtin.uri:
        url: "{{ cachyos_mirror }}/"
        return_content: true
      register: cachyos_index

    - name: Resolve the latest CachyOS keyring and mirrorlist packages
      ansible.builtin.set_fact:
        cachyos_pkg_urls: >-
          {{ cachyos_pkg_urls | default([]) + [cachyos_mirror ~ '/' ~
          (cachyos_index.content | regex_findall(item ~ '-[0-9][^"<>\s]*\.pkg\.tar\.zst') | last)] }}
      loop: "{{ cachyos_pkg_names }}"

    # Install the CachyOS keyring and mirrorlist packages directly from URLs
    - name: Install CachyOS keyring and mirrorlist packages
      community.general.pacman:
        name: "{{ cachyos_pkg_urls }}"
        state: present
        force: true
      register: pkg_install
      changed_when: pkg_install.changed

    # Ensure the CachyOS repositories are present in pacman.conf
    - name: Add CachyOS repositories to pacman.conf
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} ANSIBLE MANAGED CACHYOS REPOS"
        block: "{{ pacman_repo_block }}"
        insertafter: EOF
        create: true
        mode: "0644"
      register: conf_block

    # Clear the local pacman package cache
    - name: Clear pacman cache
      ansible.builtin.command:
        cmd: "pacman -Scc --noconfirm"
      register: cache_clean
      changed_when: "'removing' in cache_clean.stdout.lower()"

    # Refresh the pacman sync database so new repositories are available
    - name: Refresh pacman database
      community.general.pacman:
        update_cache: true
        upgrade: false
      register: sync_update

    # Provide a short summary of what the playbook did
    - name: Print status summary
      ansible.builtin.debug:
        msg: |
          Key received and signed successfully: {{ recv_key.rc == 0 and lsign_key.rc == 0 }}
          Packages installed or updated: {{ pkg_install.changed }}
          Repository block added or already present: {{ conf_block.changed }}
          Pacman cache cleared: {{ cache_clean.changed }}
          Pacman database refreshed: {{ sync_update.changed }}
