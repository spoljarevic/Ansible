---
- name: Arch Linux post-install setup
  hosts: all
  become: true

  tasks:
    - name: Install base packages with pacman
      community.general.pacman:
        name:
          - rsync
          - slurp
          - swayimg
          - wl-clipboard
          - meson
          - scdoc
          - alsa-utils
          - ansible
          - baresip
          - base
          - base-devel
          - bat
          - bluez
          - bluez-utils
          - calc
          - cava
          - certbot
          - certbot-nginx
          - chafa
          - darktable
          - docker
          - dunst
          - fastfetch
          - figlet
          - filezilla
          - fish
          - flatpak
          - foot
          - git
          - greetd
          - grim
          - grub
          - hypridle
          - hyprland
          - hyprlock
          - hyprpaper
          - hyprpicker
          - kitty
          - lf
          - man-db
          - man-pages
          - mpd
          - mpv
          - ncmpcpp
          - nginx
          - noto-fonts
          - noto-fonts-cjk
          - noto-fonts-emoji
          - openssh
          - pavucontrol
          - piper
          - pipewire-alsa
          - pipewire-pulse
          - qbittorrent
          - qt5-wayland
          - remmina
          - torbrowser-launcher
          - ttf-dejavu
          - ttf-liberation
          - ufw
          - unzip
          - vim
          - waybar
          - wayland
          - wayland-protocols
          - webkit2gtk
          - wget
          - whois
          - wireguard-tools
          - wl-clipboard
          - wlroots
          - wofi
          - go
          - proton-vpn-gtk-app
        state: present
        update_cache: true

    - name: Add flathub remote if not already added
      ansible.builtin.command: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      args:
        creates: /var/lib/flatpak/repo/flathub.trustedkeys.gpg

    - name: Install Flatpak applications
      become: true
      community.general.flatpak:
        name:
          - ch.threema.threema-desktop
          - com.discordapp.Discord
          - com.valvesoftware.Steam
        state: present
        method: system

    - name: Create user directories
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      loop:
        - downloads
        - pictures
        - music
        - desktop

    - name: Ensure rsync is installed on target
      ansible.builtin.package:
        name: rsync
        state: present

    - name: Copy ~/pictures from control to target
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/pictures"
        dest: "/home/{{ ansible_user }}/pictures"
        mode: "0755"
        remote_src: false
      delegate_to: localhost
      become: false

    - name: Set ownership of pictures directory on remote
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/pictures"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true

    - name: Clean up /tmp directory (non-sudo, only user-owned files)
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        find /tmp -maxdepth 1 -user "$(whoami)" -type f -delete &&
        find /tmp -maxdepth 1 -user "$(whoami)" -type d ! -path /tmp -exec rm -rf {} +
      changed_when: true

    - name: Remove .config directory on remote
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.config"
        state: absent

    - name: Recreate .config directory on target
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.config"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Remove old config tarball if it exists
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: /tmp/configs.tar.gz
        state: absent

    - name: Create a tarball of contents of .config on localhost
      delegate_to: localhost
      become: false
      ansible.builtin.command: tar czf /tmp/configs.tar.gz -C "{{ lookup('env', 'HOME') }}/.config" .  # noqa: command-instead-of-module
      changed_when: true

    - name: Copy tarball to remote
      ansible.builtin.copy:
        src: /tmp/configs.tar.gz
        dest: /tmp/configs.tar.gz
        force: true
        mode: "0600"

    - name: Extract config tarball on target
      ansible.builtin.unarchive:
        src: /tmp/configs.tar.gz
        dest: "/home/{{ ansible_user }}/.config"
        remote_src: true
        extra_opts: [--no-overwrite-dir]

    - name: Set ownership of extracted config files
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.config"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true

    - name: Clean up /tmp directory (non-sudo, only user-owned files)
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        find /tmp -maxdepth 1 -user "$(whoami)" -type f -delete &&
        find /tmp -maxdepth 1 -user "$(whoami)" -type d ! -path /tmp -exec rm -rf {} +
      changed_when: true

    - name: Remove pictures directory on remote
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/pictures"
        state: absent

    - name: Recreate pictures directory on target
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/pictures"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Remove old config tarball if it exists
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: /tmp/configs.tar.gz
        state: absent

    - name: Create a tarball of contents of pictures on localhost
      delegate_to: localhost
      become: false
      ansible.builtin.command: tar czf /tmp/configs.tar.gz -C "{{ lookup('env', 'HOME') }}/pictures" .  # noqa: command-instead-of-module
      changed_when: true

    - name: Copy tarball to remote
      ansible.builtin.copy:
        src: /tmp/configs.tar.gz
        dest: /tmp/configs.tar.gz
        force: true
        mode: "0600"

    - name: Extract config tarball on target
      ansible.builtin.unarchive:
        src: /tmp/configs.tar.gz
        dest: "/home/{{ ansible_user }}/pictures"
        remote_src: true
        extra_opts: [--no-overwrite-dir]

    - name: Set ownership of extracted config files
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/pictures"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true

    - name: Copy /usr/share/fonts from control to target
      ansible.builtin.copy:
        src: "/usr/share/fonts"
        dest: "/usr/share/fonts"
        mode: "0755"
        remote_src: false
      delegate_to: localhost

    - name: Set ownership of fonts on remote
      ansible.builtin.file:
        path: "/usr/share/fonts"
        owner: root
        group: root
        recurse: true

    - name: Ensure base-devel is installed
      community.general.pacman:
        name: base-devel
        state: present
        update_cache: true

    - name: Install git
      community.general.pacman:
        name: git
        state: present

    - name: Create AUR build user
      ansible.builtin.user:
        name: aur_builder
        create_home: true
        group: wheel
        shell: /bin/bash
      become: true

    - name: Allow passwordless pacman for aur_builder
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/aur_builder
        line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
        create: true
        validate: "visudo -cf %s"
        mode: "0644"
      become: true

    - name: Install yay with makepkg
      kewlfft.aur.aur:
        name: yay
        use: makepkg
        state: present
      become: true
      become_user: aur_builder

    - name: Install AUR packages using yay
      kewlfft.aur.aur:
        use: yay
        name:
          - cmatrix-git
          - onlyoffice-bin
          - proton-mail-bin
          - proton-pass-bin
          - tofi
          - vesktop-bin
          - vscodium-bin
          - zen-browser-bin
          - snapd
      become: true
      become_user: aur_builder
